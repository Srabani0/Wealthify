server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /inventory) don't exist as real
    # files — fall back to index.html so a hard refresh on a deep route
    # doesn't 404, and let the app's own router take over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
